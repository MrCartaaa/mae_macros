name: CI

on:
  pull_request:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  secret_scan:
    name: 🛡️ Watchers of the Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📦 Cache tool binaries
        id: cache-tools-secret-scan
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tools-trufflehog-latest-${{ runner.os }}

      - name: 🔧 Install trufflehog
        if: steps.cache-tools-secret-scan.outputs.cache-hit != 'true'
        run: |
          echo "::group::Installing trufflehog"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin" >/dev/null 2>&1
          echo "::endgroup::"

      - name: 🔧 Add tools to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🔐 Secret scan
        run: trufflehog git file://. --since-commit HEAD~1 --only-verified --fail

  integrity:
    name: 🏔️ Through the Mines of Moria
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_QUIET: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install system dependencies
        run: |
          echo "::group::Installing system dependencies"
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y build-essential pkg-config libssl-dev >/dev/null 2>&1
          echo "::endgroup::"

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📦 Restore build cache
        uses: Swatinem/rust-cache@v2

      - name: 🔧 Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: 🔧 Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: 🔧 Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: 🦀 Install nightly toolchain (coverage)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: 🎨 Check formatting
        run: cargo fmt -- --check

      - name: 📊 Coverage (tests/ suite, no Docker)
        run: |
          set -o pipefail
          THRESHOLD=$(python3 -c "
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path('.ci/ci_env.toml').read_text())
          print(d.get('coverage_threshold', 45))
          ")
          echo "Coverage threshold: ${THRESHOLD}%"
          if [ "$THRESHOLD" = "0" ]; then
            echo "coverage_threshold=0 — skipping llvm-cov"
            exit 0
          fi
          # Docker-gated #[mae_test(docker)] tests skip. Same command as smoke-test.sh.
          unset MAE_TESTCONTAINERS
          cargo +nightly llvm-cov nextest --no-pager --no-tests=warn \
            --fail-under-lines "$THRESHOLD" 2>&1 | grep -v '^info: cargo-llvm-cov'

      - name: 🔍 Clippy
        run: cargo clippy -- -D warnings

      - name: 📦 Cargo Deny
        run: cargo deny check
